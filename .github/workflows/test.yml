# Deadline – Schnelltest bei jedem Push (alle Karten, Hauptquest Goldene Maske, Koop Host + Gast)
# Abschalten: in GitHub unter Actions → „Schnelltest“ → „Disable workflow“ oder diese Datei löschen.
name: Schnelltest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.49.1 three@0.160.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
